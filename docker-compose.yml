name: lifeflow
x-backend: &backend
  build:
    context: .
    dockerfile: infrastructure/docker/backend.Dockerfile
  env_file: .env
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://lifeflow:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/lifeflow
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://minio:9000
    CLAMAV_HOST: clamav
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    storage-init: {condition: service_completed_successfully}
  restart: unless-stopped
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lifeflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: lifeflow
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U lifeflow"], interval: 5s, timeout: 5s, retries: 20}
  redis:
    image: redis:7.4.3-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 5s, retries: 20}
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lifeflow-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-storage-only-change-me}
    command: server /data --console-address :9001
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["objects:/data"]
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lifeflow-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-storage-only-change-me}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done; mc mb --ignore-existing local/lifeflow-private; mc anonymous set none local/lifeflow-private'
  clamav:
    image: clamav/clamav:1.4.2
    volumes: ["clamav:/var/lib/clamav"]
    ports: ["127.0.0.1:3310:3310"]
  migrate:
    <<: *backend
    restart: "no"
    command: ["/bin/sh", "-c", "alembic upgrade head && python -m app.manage seed"]
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  admin:
    profiles: [web]
    build:
      context: .
      dockerfile: infrastructure/docker/admin.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    ports: ["127.0.0.1:3000:3000"]
volumes:
  postgres:
  redis:
  objects:
  clamav:
