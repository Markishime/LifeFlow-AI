name: Validate LifeFlow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: lifeflow, POSTGRES_PASSWORD: test-only, POSTGRES_DB: lifeflow_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lifeflow" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: ruff format --check backend
      - run: pytest -q
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
        env: {DATABASE_URL: 'postgresql+psycopg://lifeflow:test-only@localhost:5432/lifeflow_test'}
      - run: pytest tests/test_postgres.py -q
        working-directory: backend
        env: {TEST_POSTGRES_URL: 'postgresql+psycopg://lifeflow:test-only@localhost:5432/lifeflow_test'}
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:admin
      - run: npx expo export --platform web
        working-directory: apps/mobile
